name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels an older run that's still going,
# so rapid Pages CMS saves don't queue up; the newest content always wins.
# (Group renamed from "pages" on 2026-11-11 to get past a run GitHub left stuck holding that lock.)
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung build fails instead of blocking later deploys
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 26 # keep in sync with .nvmrc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
